name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 shellcheck git

      - name: Verificar sintaxe Bash
        run: |
          for file in install-*-ubuntu.sh opencode-desktop/ai-tooling-vm lib/*.sh bin/*; do
            bash -n "$file"
          done

      - name: Executar ShellCheck
        run: shellcheck -x -S warning install-*-ubuntu.sh opencode-desktop/ai-tooling-vm lib/*.sh bin/*

      - name: Preparar usuário comum
        run: |
          sudo useradd -m tester
          sudo chown -R tester:tester "$GITHUB_WORKSPACE/tests"

      - name: Executar testes
        run: |
          set +e
          output=$(sudo -u tester -H python3 -m unittest discover -v tests 2>&1)
          status=$?
          if (( status != 0 )); then
            output=${output//%/%25}
            output=${output//$'\r'/%0D}
            output=${output//$'\n'/%0A}
            echo "::error::$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
