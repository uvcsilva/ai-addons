# Os instaladores sao para Ubuntu; os testes rodam no mesmo ambiente (Bash 5, GNU coreutils, Python 3.12).
test:
  image: ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 shellcheck
  script:
    - for f in install-*-ubuntu.sh opencode-desktop/ai-tooling-vm lib/*.sh; do bash -n "$f"; done
    - shellcheck -x -S warning install-*-ubuntu.sh opencode-desktop/ai-tooling-vm lib/*.sh
    # Os instaladores recusam root; os testes de fluxo rodam o preambulo real, entao a suite usa um usuario comum.
    - useradd -m tester && chown -R tester "$CI_PROJECT_DIR"
    - runuser -u tester -- python3 -m unittest discover -v tests
